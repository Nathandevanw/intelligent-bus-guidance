name: Java CI/CD Pipeline Build Verification

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Download source repository codes
      uses: actions/checkout@v3

    - name: Initialize Java JDK Runtime Environment
      uses: actions/setup-java@v4
      with:
        java-version: '20'
        distribution: 'adopt'
        cache: maven
    
    - name: run tests with maven
      run: mvn test
      
    - name: Compile codebase and execute automated verification tests
      run: mvn clean test